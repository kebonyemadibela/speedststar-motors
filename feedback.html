<body>
    <header>
        <h1>Speedstar Motors</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="aboutus.html">About Us</a></li>
                <li><a href="contactus.html">Contact Us</a></li>
                <li><a href="feedback.html">Feedback</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="products.html">Products</a></li>
            </ul>
        </nav>
    </header>

        <div class="feedback-box">
            <div class="banner">
                <h1>We Value Your Feedback!</h1>
                <p>Help us improve your experience at Speedstar Motors.</p>
            </div>
            <form action="\" onsubmit="return validateForm()">
                <div class="form-group">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required>
                    <p class="error" id="nameError"></p>
                </div>
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                    <p class="error" id="emailError"></p>
                </div>
    
                <div class="form-group">
                    <label for="feedback">Feedback:</label>
                    <textarea id="feedback" name="feedback" rows="4" required></textarea>
                    <p class="error" id="messageError"></p>
                </div>
                <button type="submit" class="submit-btn" id="submitBtn">Submit</button>
            </form>
<script>
    function validateForm() {
        let isValid = true; 
        let name = document.getElementById("name").value.trim();
        let email = document.getElementById("email").value.trim();
        let feedback = document.getElementById("feedback").value.trim();

        let nameError = document.getElementById("nameError");
        let emailError = document.getElementById("emailError");
        let messageError = document.getElementById("messageError"); 

        nameError.textContent = "";
        emailError.textContent = "";
        messageError.textContent = "";

        let namePattern = /^[A-Za-z\s]+$/;
        if (name.length < 3 || !namePattern.test(name)) {
            nameError.textContent = "Name must be at least 3 characters long and contain only letters";
            isValid = false;
        }

        let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailPattern.test(email)) { 
            emailError.textContent = "Enter a valid email address";
            isValid = false;
        }

        if (feedback.length < 10) {
            messageError.textContent = "Feedback must be at least 10 characters long";
            isValid = false;
        }

        return isValid;
    }
</script>
